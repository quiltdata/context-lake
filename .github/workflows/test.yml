name: Tests and package
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev,s3,formats,quilt,models]'
      - run: ruff check src tests
      - run: pytest -q
      - run: python -m build
      - name: Install and exercise the core wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/core"
          "$RUNNER_TEMP/core/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/core/bin/python" -I "$GITHUB_WORKSPACE/tests/wheel_smoke.py"
          "$RUNNER_TEMP/core/bin/clake" --version
          "$RUNNER_TEMP/core/bin/clake" --help | grep -q '^usage: clake'
          "$RUNNER_TEMP/core/bin/context-lake" --version
      - uses: actions/upload-artifact@v4
        with:
          name: context-lake-${{ matrix.python }}
          path: dist/

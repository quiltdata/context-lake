[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "quilt-context-lake"
version = "0.2.1"
description = "Deterministic context automation: collect, normalize, index, reconcile and publish."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["jsonschema>=4"]

[project.urls]
Repository = "https://github.com/quiltdata/context-lake"

[project.scripts]
qcl = "context_lake.cli:main"

[project.optional-dependencies]
s3 = ["boto3>=1.35"]
formats = ["pypdf>=4", "pyarrow>=14", "openpyxl>=3.1"]
quilt = ["quilt3>=7.3,<8"]
models = ["boto3>=1.35"]
dev = ["pytest>=8", "ruff==0.15.17", "moto[s3]>=5,<6", "build>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/context_lake"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
